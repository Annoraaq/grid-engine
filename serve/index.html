<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Engine - Spot Walk Demo (#534)</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #controls {
        width: 720px;
        box-sizing: border-box;
        padding: 12px 16px;
        background: #1e1e24;
        border-bottom: 1px solid #333;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      button {
        padding: 6px 10px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2b2b35;
        color: #eee;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #3a3a48;
      }
      button.active {
        background: #3b82f6;
        border-color: #60a5fa;
        color: #fff;
        font-weight: 600;
      }
      #status {
        font-size: 13px;
        color: #cbd5e1;
      }
      code {
        background: #111;
        padding: 2px 5px;
        border-radius: 3px;
        color: #93c5fd;
      }
      .hint {
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div class="row">
        <strong>Player <code>spotWalk</code>:</strong>
        <button id="toggle-player-spot" class="active">true</button>
        <strong style="margin-left: 8px">Speed:</strong>
        <button data-speed="0">0</button>
        <button data-speed="1">1</button>
        <button data-speed="2">2</button>
        <button data-speed="4" class="active">4</button>
        <button data-speed="8">8</button>
        <strong style="margin-left: 8px">Turn:</strong>
        <button data-turn="up">Up</button>
        <button data-turn="down">Down</button>
        <button data-turn="left">Left</button>
        <button data-turn="right">Right</button>
      </div>
      <div class="row">
        <strong>NPCs <code>spotWalk</code>:</strong>
        <button id="toggle-npc-spot" class="active">true</button>
        <button id="turn-npcs-btn">Rotate NPCs</button>
      </div>
      <div id="status">Loading...</div>
      <div class="hint">
        Use Arrow keys to walk the player around and stop to see spot walk
        resume seamlessly. The 4 NPCs below demonstrate speeds
        <code>1</code>, <code>2</code>, <code>4</code>, and <code>8</code>.
      </div>
    </div>
    <div id="game"></div>

    <script src="js/phaser-4.0.0.min.js"></script>
    <script src="js/GridEngine.js"></script>
    <script src="js/getBasicConfig.js"></script>

    <script>
      const config = getBasicConfig(preload, create, update);
      const game = new Phaser.Game(config);

      let activeScene;
      let cursors;
      let playerSpotWalk = true;
      let playerSpeed = 4;
      let npcSpotWalk = true;

      const DIRECTIONS = ["down", "left", "up", "right"];
      let npcDirIndex = 0;

      const NPCS = [
        { id: "npc_1", speed: 1, x: 12, y: 12, mapping: 0, dir: "down" },
        { id: "npc_2", speed: 2, x: 13, y: 12, mapping: 1, dir: "left" },
        { id: "npc_3", speed: 4, x: 15, y: 12, mapping: 2, dir: "right" },
        { id: "npc_4", speed: 8, x: 16, y: 12, mapping: 3, dir: "up" },
      ];

      function preload() {
        this.load.image("tiles", "assets/cloud_tileset.png");
        this.load.tilemapTiledJSON("cloud-city-map", "assets/cloud_city.json");
        this.load.spritesheet("player", "assets/characters.png", {
          frameWidth: 52,
          frameHeight: 72,
        });
      }

      function create() {
        activeScene = this;
        const cloudCityTilemap = this.make.tilemap({ key: "cloud-city-map" });
        cloudCityTilemap.addTilesetImage("Cloud City", "tiles");
        for (let i = 0; i < cloudCityTilemap.layers.length; i++) {
          const layer = cloudCityTilemap.createLayer(i, "Cloud City", 0, 0);
          layer.scale = 3;
        }

        const playerSprite = this.add.sprite(0, 0, "player");
        playerSprite.scale = 1.5;

        this.cameras.main.startFollow(playerSprite, true);
        this.cameras.main.setFollowOffset(
          -playerSprite.width,
          -playerSprite.height,
        );

        const characters = [
          {
            id: "player",
            sprite: playerSprite,
            walkingAnimationMapping: 6,
            startPosition: { x: 14, y: 10 },
            speed: playerSpeed,
            spotWalk: playerSpotWalk,
          },
        ];

        for (const npc of NPCS) {
          const spr = this.add.sprite(0, 0, "player");
          spr.scale = 1.5;
          characters.push({
            id: npc.id,
            sprite: spr,
            walkingAnimationMapping: npc.mapping,
            startPosition: { x: npc.x, y: npc.y },
            facingDirection: npc.dir,
            speed: npc.speed,
            spotWalk: npcSpotWalk,
          });
        }

        this.gridEngine.create(cloudCityTilemap, { characters });

        cursors = this.input.keyboard.createCursorKeys();
        setupControls();
        updateStatus();
      }

      function setupControls() {
        const playerToggle = document.getElementById("toggle-player-spot");
        playerToggle.addEventListener("click", () => {
          playerSpotWalk = !playerSpotWalk;
          activeScene.gridEngine.setSpotWalk("player", playerSpotWalk);
          playerToggle.textContent = String(playerSpotWalk);
          playerToggle.classList.toggle("active", playerSpotWalk);
          updateStatus();
        });

        document.querySelectorAll("button[data-speed]").forEach((btn) => {
          btn.addEventListener("click", () => {
            playerSpeed = Number(btn.dataset.speed);
            activeScene.gridEngine.setSpeed("player", playerSpeed);
            document
              .querySelectorAll("button[data-speed]")
              .forEach((b) =>
                b.classList.toggle(
                  "active",
                  Number(b.dataset.speed) === playerSpeed,
                ),
              );
            updateStatus();
          });
        });

        document.querySelectorAll("button[data-turn]").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeScene.gridEngine.turnTowards("player", btn.dataset.turn);
            updateStatus();
          });
        });

        const npcToggle = document.getElementById("toggle-npc-spot");
        npcToggle.addEventListener("click", () => {
          npcSpotWalk = !npcSpotWalk;
          for (const npc of NPCS) {
            activeScene.gridEngine.setSpotWalk(npc.id, npcSpotWalk);
          }
          npcToggle.textContent = String(npcSpotWalk);
          npcToggle.classList.toggle("active", npcSpotWalk);
          updateStatus();
        });

        document
          .getElementById("turn-npcs-btn")
          .addEventListener("click", () => {
            npcDirIndex = (npcDirIndex + 1) % DIRECTIONS.length;
            const dir = DIRECTIONS[npcDirIndex];
            for (const npc of NPCS) {
              activeScene.gridEngine.turnTowards(npc.id, dir);
            }
            updateStatus();
          });
      }

      function updateStatus() {
        if (!activeScene) return;
        const pos = activeScene.gridEngine.getPosition("player");
        const dir = activeScene.gridEngine.getFacingDirection("player");
        const isSpot = activeScene.gridEngine.isSpotWalking("player");
        const isMoving = activeScene.gridEngine.isMoving("player");
        document.getElementById("status").innerHTML =
          `Player: <code>(${pos.x}, ${pos.y})</code> &nbsp;|&nbsp; ` +
          `facing: <code>${dir}</code> &nbsp;|&nbsp; ` +
          `speed: <code>${playerSpeed}</code> &nbsp;|&nbsp; ` +
          `spotWalk: <code>${isSpot}</code> &nbsp;|&nbsp; ` +
          `isMoving: <code>${isMoving}</code>`;
      }

      function update() {
        if (!cursors) return;
        if (cursors.left.isDown) {
          this.gridEngine.move("player", "left");
        } else if (cursors.right.isDown) {
          this.gridEngine.move("player", "right");
        } else if (cursors.up.isDown) {
          this.gridEngine.move("player", "up");
        } else if (cursors.down.isDown) {
          this.gridEngine.move("player", "down");
        }
        updateStatus();
      }
    </script>
  </body>
</html>
